<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/login.css">

        <link rel="icon" type="png" href="assets/icon__icey.png">
    
</head>    
<header>
   
</header>
<body>
    <div class="overlay__background">
    </div>
    <div class="background__img"> 
        
    <div class="container">
        <h1>Sistema de Asistencias</h1>
        <div class="login">
        <h2>Iniciar Sesión</h2>
        <form name="login"  action="main.html" method="post">
            <div class="user">

             
                
                
                  
                <img src="./assets/user-svgrepo-com.svg" class="input-icon" alt="user">
            
                
            <input type="text" id="username" name="username" placeholder="Usuario" required>
            </div>
            <div class="pass">
                <img src="./assets/password-svgrepo-com.svg" class="input-icon" alt="lock">
                <input type="password" id="password" name="password" placeholder="Contraseña" required>
            </div>
            <button type="submit">Ingresar</button>
            
        </form>
        
        </div>
    
    </div>

    
</body>
</html>
